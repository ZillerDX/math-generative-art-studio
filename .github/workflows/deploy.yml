name: Deploy Axiom Studio to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Restrict GITHUB_TOKEN permissions to least-privilege required for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployment runs
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Type Check
        run: npx tsc --noEmit

      - name: Run Test Suite
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
